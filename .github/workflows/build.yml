name: Build

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    name: Format, Build, and Test
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: latest-stable

      - name: Show Swift version
        run: swift --version

      - name: Prepare validation script
        run: chmod +x Scripts/validate.sh

      - name: Run validation script
        run: ./Scripts/validate.sh
