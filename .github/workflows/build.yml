name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    name: Format, Build, and Test
    runs-on: macos-15
    env:
      SWIFTPM_CACHE_KEY: ${{ runner.os }}-xcode-${{ hashFiles('Package.swift', '.swift-format', 'Scripts/validate.sh') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Restore SwiftPM cache
        id: restore-swiftpm-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
          key: ${{ env.SWIFTPM_CACHE_KEY }}
          restore-keys: |
            ${{ runner.os }}-xcode-

      - name: Show Swift version
        run: swift --version

      - name: Prepare validation script
        run: chmod +x Scripts/validate.sh

      - name: Run validation script
        run: ./Scripts/validate.sh

      - name: Save SwiftPM cache
        if: ${{ always() }}
        uses: actions/cache/save@v5
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
          key: ${{ steps.restore-swiftpm-cache.outputs.cache-primary-key || env.SWIFTPM_CACHE_KEY }}
