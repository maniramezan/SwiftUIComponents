name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    name: Format, Build, and Test
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Restore SwiftPM cache
        id: restore-swiftpm-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
          key: swiftpm-${{ hashFiles('Package.swift', '.swift-format', 'Scripts/validate.sh') }}
          restore-keys: |
            swiftpm-

      - name: Show Swift version
        run: swift --version

      - name: Prepare validation script
        run: chmod +x Scripts/validate.sh

      - name: Run validation script
        run: ./Scripts/validate.sh

      - name: Copy snapshot baselines into DocC Resources
        run: |
          chmod +x Scripts/copy-snapshots-to-docc.sh
          ./Scripts/copy-snapshots-to-docc.sh

      - name: Validate DocC (DesignSystem)
        run: |
          swift package generate-documentation \
            --target DesignSystem \
            --warnings-as-errors

      - name: Validate DocC (Components)
        run: |
          swift package generate-documentation \
            --target Components \
            --warnings-as-errors

      - name: Save SwiftPM cache
        if: ${{ always() }}
        uses: actions/cache/save@v5
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
          key: swiftpm-${{ hashFiles('Package.swift', '.swift-format', 'Scripts/validate.sh') }}
