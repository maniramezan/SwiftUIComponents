name: Documentation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-docs:
    name: Build Documentation
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Restore SwiftPM cache
        id: restore-swiftpm-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
          key: docs-${{ hashFiles('Package.swift') }}
          restore-keys: |
            docs-

      - name: Render component snapshots
        # swift-snapshot-testing exits non-zero after writing new images in record
        # mode — that is expected behaviour. The images are written regardless.
        run: |
          swift test --filter ComponentSnapshot || true

      - name: Copy snapshots into DocC Resources
        run: |
          chmod +x Scripts/copy-snapshots-to-docc.sh
          ./Scripts/copy-snapshots-to-docc.sh

      - name: Build DesignSystem documentation
        run: |
          mkdir -p .docs-output
          swift package --disable-sandbox generate-documentation \
            --target DesignSystem \
            --warnings-as-errors \
            --exclude-extended-types \
            --transform-for-static-hosting \
            --hosting-base-path SwiftUIComponents \
            --output-path .docs-output/designsystem

      - name: Build Components documentation
        run: |
          swift package --disable-sandbox generate-documentation \
            --target Components \
            --warnings-as-errors \
            --exclude-extended-types \
            --transform-for-static-hosting \
            --hosting-base-path SwiftUIComponents \
            --output-path .docs-output/components

      - name: Save SwiftPM cache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
          key: docs-${{ hashFiles('Package.swift') }}

      # --- Publish only on pushes to main ---
      - name: Prepare combined site
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          mkdir -p .docs-site

          # Start with DesignSystem as the base (provides all shared renderer assets)
          cp -R .docs-output/designsystem/ .docs-site/

          # Merge Components page content
          cp -R .docs-output/components/data/documentation/components \
                .docs-site/data/documentation/
          cp -R .docs-output/components/data/documentation/components.json \
                .docs-site/data/documentation/
          cp -R .docs-output/components/documentation/components \
                .docs-site/documentation/

          # Merge navigator index so both targets appear in the DocC nav bar
          python3 - <<'PYEOF'
          import json, sys

          with open('.docs-output/designsystem/index/index.json') as f:
              ds = json.load(f)
          with open('.docs-output/components/index/index.json') as f:
              comp = json.load(f)

          merged = {
              "schemaVersion": ds["schemaVersion"],
              "includedArchiveIdentifiers": (
                  ds["includedArchiveIdentifiers"] +
                  comp["includedArchiveIdentifiers"]
              ),
              "interfaceLanguages": {},
          }

          all_langs = set(ds["interfaceLanguages"]) | set(comp["interfaceLanguages"])
          for lang in sorted(all_langs):
              merged["interfaceLanguages"][lang] = (
                  ds["interfaceLanguages"].get(lang, []) +
                  comp["interfaceLanguages"].get(lang, [])
              )

          with open('.docs-site/index/index.json', 'w') as f:
              json.dump(merged, f)
          print("Merged index.json written.")
          PYEOF

          # Root landing page linking both published DocC targets.
          cat > .docs-site/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <meta name="description" content="Browse SwiftUIComponents documentation for the DesignSystem and Components packages.">
              <title>SwiftUIComponents Documentation</title>
              <style>
                :root {
                  color-scheme: light dark;
                  --background: #0b1020;
                  --surface: rgba(15, 23, 42, 0.82);
                  --surface-border: rgba(148, 163, 184, 0.22);
                  --text: #e5e7eb;
                  --muted: #cbd5e1;
                  --accent: #a78bfa;
                  --accent-strong: #8b5cf6;
                  --shadow: rgba(15, 23, 42, 0.35);
                }

                @media (prefers-color-scheme: light) {
                  :root {
                    --background: #f8fafc;
                    --surface: rgba(255, 255, 255, 0.94);
                    --surface-border: rgba(148, 163, 184, 0.28);
                    --text: #0f172a;
                    --muted: #475569;
                    --accent: #7c3aed;
                    --accent-strong: #6d28d9;
                    --shadow: rgba(148, 163, 184, 0.18);
                  }
                }

                * {
                  box-sizing: border-box;
                }

                body {
                  margin: 0;
                  min-height: 100vh;
                  font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                  background: var(--background);
                  color: var(--text);
                }

                main {
                  width: min(960px, calc(100% - 32px));
                  margin: 0 auto;
                  padding: 56px 0 72px;
                }

                .hero {
                  margin-bottom: 32px;
                }

                .eyebrow {
                  display: inline-block;
                  margin-bottom: 16px;
                  padding: 6px 10px;
                  border: 1px solid var(--surface-border);
                  border-radius: 999px;
                  color: var(--muted);
                  font-size: 0.78rem;
                  letter-spacing: 0.08em;
                  text-transform: uppercase;
                }

                h1 {
                  margin: 0 0 12px;
                  font-size: clamp(2.3rem, 5vw, 4rem);
                  line-height: 1.05;
                }

                .hero p {
                  margin: 0;
                  max-width: 42rem;
                  color: var(--muted);
                  font-size: 1.05rem;
                  line-height: 1.6;
                }

                .grid {
                  display: grid;
                  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
                  gap: 20px;
                }

                .card {
                  display: block;
                  padding: 24px;
                  border: 1px solid var(--surface-border);
                  border-radius: 24px;
                  background: var(--surface);
                  box-shadow: 0 18px 45px -24px var(--shadow);
                  color: inherit;
                  text-decoration: none;
                  backdrop-filter: blur(14px);
                  transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
                }

                .card:hover,
                .card:focus-visible {
                  transform: translateY(-2px);
                  border-color: color-mix(in srgb, var(--accent) 48%, var(--surface-border));
                  box-shadow: 0 24px 50px -24px var(--shadow);
                  outline: none;
                }

                .card strong {
                  display: block;
                  margin-bottom: 10px;
                  font-size: 1.2rem;
                }

                .card p {
                  margin: 0 0 18px;
                  color: var(--muted);
                  line-height: 1.55;
                }

                .cta {
                  color: var(--accent);
                  font-weight: 600;
                }

                footer {
                  margin-top: 28px;
                  color: var(--muted);
                  font-size: 0.95rem;
                }
              </style>
            </head>
            <body>
              <main>
                <section class="hero">
                  <span class="eyebrow">SwiftUIComponents Docs</span>
                  <h1>Documentation for the full SwiftUIComponents stack.</h1>
                  <p>Browse the foundational design tokens in <strong>DesignSystem</strong> or jump straight to the reusable views and modifiers in <strong>Components</strong>.</p>
                </section>

                <section class="grid" aria-label="Documentation targets">
                  <a class="card" href="documentation/designsystem">
                    <strong>DesignSystem</strong>
                    <p>Theme protocols, tokens, colors, typography, spacing, motion, and the shared primitives that power the component library.</p>
                    <span class="cta">Open DesignSystem docs</span>
                  </a>

                  <a class="card" href="documentation/components">
                    <strong>Components</strong>
                    <p>Production-ready SwiftUI buttons, inputs, surfaces, layout utilities, feedback views, and other packaged UI building blocks.</p>
                    <span class="cta">Open Components docs</span>
                  </a>
                </section>

                <footer>
                  Both targets also remain available in the DocC navigator once you open either documentation archive.
                </footer>
              </main>
            </body>
          </html>
          EOF

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .docs-site

  deploy-docs:
    name: Deploy Documentation
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build-docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
